name: Bug report
description: Report reproducible behavior in the package
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here. Read SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: 19.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the behavior you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a small repository, sandbox, or exact steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
